/* ===================== MAP DRAWING ===================== */
function drawMap(){
  const svg = document.getElementById('mapsvg');
  if(!svg || !lastComputed) return;
  const {sourcing, risk, hubs} = lastComputed;
  // State shapes/labels are baked as literal SVG attributes (not CSS-driven), so they need an
  // explicit light/dark palette rather than following the page theme automatically.
  const mapColors = THEME==='dark'
    ? { fill:'#1B2430', stroke:'#3A4657', label:'#5A6B82' }
    : { fill:'#FFFFFF', stroke:'#CBD2DB', label:'#AEB6C2' };
  let html = '';
  Object.values(STATE_PATHS).forEach(d=>{
    html += `<path d="${d}" fill="${mapColors.fill}" stroke="${mapColors.stroke}" stroke-width="0.8"/>`;
  });
  STATE_LABELS.forEach(s=>{
    const [x,y] = svgXY(s.lat,s.lon);
    html += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="7" fill="${mapColors.label}" text-anchor="middle" dominant-baseline="middle" font-family="Arial,Helvetica,sans-serif" style="pointer-events:none;user-select:none">${s.abbr}</text>`;
  });

  // assignment lines
  const maxAmt = Math.max(1,...sourcing.flows.map(f=>f.amt));
  sourcing.flows.forEach(f=>{
    const n = S.demand.find(x=>x.id===f.nodeId), s = S.supply.find(x=>x.id===f.sourceId);
    if(!n||!s) return;
    const [x1,y1]=svgXY(n.lat,n.lon), [x2,y2]=svgXY(s.lat,s.lon);
    const w = 0.5 + 2.2*(f.amt/maxAmt);
    html += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#8FA3BF" stroke-width="${w.toFixed(2)}" opacity="0.55"/>`;
  });

  // hub delivery-radius circles + hub markers (proposed centroid locations, diamond markers)
  // Radius is a fixed value driven directly by Parameters: Target Max Resupply Time x Average Transit Speed —
  // not an empirical average of actual covered-node distances — so every hub draws the same-size circle,
  // letting you visually spot any covered node that falls outside the configured delivery radius.
  const kmPerMile = 1.60934;
  const deliveryRadiusMiles = S.params.targetRadius;
  const deliveryRadiusPx = deliveryRadiusMiles * kmPerMile * PROJ.scale;
  if(S.showTrailerRadius){
    hubs.forEach(h=>{
      const [hx,hy] = svgXY(h.lat,h.lon);
      html += `<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="${deliveryRadiusPx.toFixed(1)}" fill="#F2A900" fill-opacity="0.06" stroke="#F2A900" stroke-width="1.3" opacity="0.75"/>`;
    });
  }
  hubs.forEach(h=>{
    const [hx,hy] = svgXY(h.lat,h.lon);
    html += `<g transform="translate(${hx.toFixed(1)},${hy.toFixed(1)}) rotate(45)" class="node-hub" data-id="hub${h.idx}" style="cursor:pointer">
      <rect x="-6" y="-6" width="12" height="12" fill="#F2A900" stroke="#fff" stroke-width="1.3"/>
    </g>`;
  });

  // Mobile HyCAS unit coverage circles + triangle markers — visually distinct (purple, dashed
  // circle) from trailer hubs (amber, solid circle) since it's a separate resiliency mechanism
  // with its own radius/time targets.
  const hycasUnits = lastComputed.hycasUnits || [];
  const hycasRadiusPx = S.params.hycasRadius * kmPerMile * PROJ.scale;
  if(S.showHycasRadius){
    hycasUnits.forEach(u=>{
      const [ux,uy] = svgXY(u.lat,u.lon);
      html += `<circle cx="${ux.toFixed(1)}" cy="${uy.toFixed(1)}" r="${hycasRadiusPx.toFixed(1)}" fill="#7A5195" fill-opacity="0.05" stroke="#7A5195" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.7"/>`;
    });
  }
  hycasUnits.forEach(u=>{
    const [ux,uy] = svgXY(u.lat,u.lon);
    html += `<g transform="translate(${ux.toFixed(1)},${uy.toFixed(1)})" class="node-hycas" data-id="hycas${u.idx}" style="cursor:pointer">
      <polygon points="0,-8 7,5 -7,5" fill="#7A5195" stroke="#fff" stroke-width="1.3"/>
    </g>`;
  });

  // supply markers — current sources are solid; future sources are dashed-outline, and further
  // ghosted (low opacity, hollow) when the Include Future toggle is off, so it's visually obvious
  // which sources actually fed this optimization run.
  S.supply.forEach(s=>{
    const [x,y]=svgXY(s.lat,s.lon);
    const isFuture = (s.status||'current')==='future';
    const isActive = !isFuture || S.params.includeFuture;
    const fill = isFuture ? (isActive ? '#5B9BD9' : mapColors.fill) : '#0071CE';
    const dash = isFuture ? ' stroke-dasharray="2,1.5"' : '';
    const opacity = isActive ? 1 : 0.55;
    html += `<rect x="${(x-5).toFixed(1)}" y="${(y-5).toFixed(1)}" width="10" height="10" fill="${fill}" stroke="#0071CE" stroke-width="1.3" opacity="${opacity}"${dash} class="node-supply" data-id="${s.id}" style="cursor:pointer"/>`;
  });

  // demand markers
  const maxRate = Math.max(1,...S.demand.map(n=>n.rate));
  const riskColor = {High:'#C81E33', Med:'#B57500', Low:'#177A4C'};
  S.demand.forEach(n=>{
    const [x,y]=svgXY(n.lat,n.lon);
    const r = 4 + 8*Math.sqrt(n.rate/maxRate);
    const tier = risk[n.id].tier;
    html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${riskColor[tier]}" stroke="#fff" stroke-width="1.3" opacity="0.92" class="node-demand" data-id="${n.id}" style="cursor:pointer"/>`;
  });

  svg.innerHTML = html;

  const tooltip = document.getElementById('mapTooltip');
  const wrap = svg.parentElement;
  function showTooltip(evt, html){
    tooltip.innerHTML = html;
    tooltip.style.display='block';
    const rect = wrap.getBoundingClientRect();
    let left = evt.clientX-rect.left+14, top = evt.clientY-rect.top+14;
    tooltip.style.left = left+'px'; tooltip.style.top = top+'px';
  }
  svg.querySelectorAll('.node-demand').forEach(el=>{
    el.addEventListener('mousemove', evt=>{
      const n = S.demand.find(x=>x.id===el.dataset.id);
      const r = risk[n.id];
      const ns = sourcing.nodeSummary[n.id];
      const srcName = ns.primary? S.supply.find(s=>s.id===ns.primary.sourceId).name : 'None';
      const tierColor = {High:'#F2647A', Med:'#F2C46D', Low:'#5FCF9B'}[r.tier];
      const reasonsHtml = riskReasons(r).map(txt=>`&bull; ${esc(txt)}`).join('<br>');
      const viaLine = r.servicedVia==='source'
        ? `Serviced via: Direct from ${esc(srcName)} (${fmt(r.tierDist,0)} mi)`
        : (r.servicedVia==='hub' ? `Serviced via: Hub ${r.hubIdx} (${fmt(r.tierDist,0)} mi)` : 'Serviced via: —');
      showTooltip(evt, `<b>${esc(n.name)}</b><br><span class="mut">${esc(n.city||'')}</span><br>
        Consumption: ${fmt(n.rate)} ${S.params.unit}/day<br>
        Primary source: ${esc(srcName)} (${fmt(r.primaryDist,0)} mi)<br>
        ${viaLine}<br>
        <span style="color:${tierColor};font-weight:700">Risk: ${r.tier}</span><br>
        <span class="mut" style="font-size:10.5px;line-height:1.5">${reasonsHtml}</span>`);
    });
    el.addEventListener('mouseleave', ()=>tooltip.style.display='none');
  });
  svg.querySelectorAll('.node-supply').forEach(el=>{
    el.addEventListener('mousemove', evt=>{
      const s = S.supply.find(x=>x.id===el.dataset.id);
      const isFuture = (s.status||'current')==='future';
      const isActive = !isFuture || S.params.includeFuture;
      const used = sourcing.sourceUsage[s.id]||0;
      const statusLine = isFuture
        ? (isActive ? '<span style="color:#8FC1F0">Future — included in this run</span>' : '<span style="color:#AAB2BD">Future — NOT included (toggle on in Supply Sources tab)</span>')
        : '<span class="mut">Current — operational</span>';
      showTooltip(evt, `<b>${esc(s.name)}</b><br><span class="mut">${esc(s.city||'')}</span><br>
        ${statusLine}<br>
        Capacity: ${fmt(s.capacity)} ${S.params.unit}/day<br>
        Allocated: ${isActive?fmt(used)+' '+S.params.unit+'/day ('+fmt(100*used/s.capacity,0)+'%)':'—'}<br>
        Unit cost: ${money(s.cost)}/${S.params.unit}`);
    });
    el.addEventListener('mouseleave', ()=>tooltip.style.display='none');
  });
  svg.querySelectorAll('.node-hub').forEach(el=>{
    el.addEventListener('mousemove', evt=>{
      const h = hubs.find(x=>('hub'+x.idx)===el.dataset.id);
      const deliveryRadiusMiles = S.params.targetRadius;
      showTooltip(evt, `<b>Proposed Staging Hub ${h.idx}</b><br><span class="mut">${h.lat.toFixed(3)}, ${h.lon.toFixed(3)}${h.cityRef?' — ~'+fmt(h.cityRef.dist,0)+' mi from '+esc(h.cityRef.name)+', '+esc(h.cityRef.state):''}</span><br>
        Covers ${h.covered.length} node(s), ${fmt(h.coveredDemand)} ${S.params.unit}/day<br>
        Recommended trailers: <b>${h.trailers}</b><br>
        Configured delivery radius: <b>${fmt(deliveryRadiusMiles,0)} mi</b><br>
        Actual avg / max reach: ${fmt(h.avgDist,0)} mi (${fmtHours(h.avgHours)}) / ${fmt(h.maxDist,0)} mi (${fmtHours(h.maxHours)})`);
    });
    el.addEventListener('mouseleave', ()=>tooltip.style.display='none');
  });
  svg.querySelectorAll('.node-hycas').forEach(el=>{
    el.addEventListener('mousemove', evt=>{
      const u = hycasUnits.find(x=>('hycas'+x.idx)===el.dataset.id);
      showTooltip(evt, `<b>Mobile HyCAS Unit ${u.idx}</b><br><span class="mut">${u.lat.toFixed(3)}, ${u.lon.toFixed(3)}${u.cityRef?' — ~'+fmt(u.cityRef.dist,0)+' mi from '+esc(u.cityRef.name)+', '+esc(u.cityRef.state):''}</span><br>
        Covers ${u.covered.length} node(s)<br>
        Largest covered node: ${fmt(u.maxNodeRate)} ${S.params.unit}/day <span style="color:${u.capacitySufficient?'#8FE0B8':'#F2647A'}">(${u.capacitySufficient?'within capacity':'exceeds capacity'})</span><br>
        Configured response radius: <b>${fmt(S.params.hycasRadius,0)} mi</b><br>
        Actual avg / max reach: ${fmt(u.avgDist,0)} mi (${fmtHours(u.avgHours)}) / ${fmt(u.maxDist,0)} mi (${fmtHours(u.maxHours)})`);
    });
    el.addEventListener('mouseleave', ()=>tooltip.style.display='none');
  });
}

/* ===================== PRESENTATION MAP EXPORT (clean, HQ, 16:9) ===================== */
function buildPresentationSVG(exportTheme){
  const {sourcing, risk, hubs, kpi, hycasUnits} = lastComputed;
  const VBW = 1920, VBH = 1080;
  const PALETTES = {
    light: { BG:'#F5F6F8', PANEL:'#FFFFFF', BORDER:'#D9DEE5', MUTED:'#5A6472', TEXT:'#22303F', HEADING:'#0B2545', MAPFILL:'#FFFFFF', MAPSTROKE:'#CBD2DB', MAPLABEL:'#A9B2BE' },
    dark:  { BG:'#0F1620', PANEL:'#171F2B', BORDER:'#2B3644', MUTED:'#98A4B7', TEXT:'#E4E9F0', HEADING:'#EDF1F7', MAPFILL:'#1B2430', MAPSTROKE:'#3A4657', MAPLABEL:'#5A6B82' },
  };
  const PAL = PALETTES[exportTheme==='dark' ? 'dark' : 'light'];
  const NAVY=PAL.HEADING, BG=PAL.BG, BORDER=PAL.BORDER, MUTED=PAL.MUTED, TEXT=PAL.TEXT;
  const riskColor = {High:'#C81E33', Med:'#B57500', Low:'#177A4C'};

  // Map viewport: left ~74% of width, between header and footer
  const mapX=36, mapY=118, mapW=1372, mapH=884;
  const mp = fitProjection(mapW, mapH, 0.94);
  function toMap(lat,lon){ const [x,y]=projectTo(lat,lon,mp); return [x+mapX, y+mapY]; }

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${VBW}" height="${VBH}" viewBox="0 0 ${VBW} ${VBH}" font-family="Arial,Helvetica,sans-serif">`;
  svg += `<rect x="0" y="0" width="${VBW}" height="${VBH}" fill="${BG}"/>`;

  // header
  svg += `<text x="36" y="52" font-size="30" font-weight="700" fill="${NAVY}">HyWeave — Network Map</text>`;
  svg += `<text x="36" y="80" font-size="14" fill="${MUTED}">Sourcing assignments &amp; recommended resiliency staging hubs — Target Delivery Radius: ${fmt(S.params.targetRadius,0)} mi</text>`;
  svg += `<rect x="36" y="90" width="120" height="4" fill="#0071CE"/>`;
  svg += `<line x1="36" y1="100" x2="${VBW-36}" y2="100" stroke="${BORDER}" stroke-width="1"/>`;

  // map panel background
  svg += `<rect x="${mapX}" y="${mapY}" width="${mapW}" height="${mapH}" fill="${PAL.PANEL}" stroke="${BORDER}" stroke-width="1"/>`;

  // Everything map-related (state shapes, labels, lines, circles, markers) is clipped to the map
  // panel rectangle so nothing — especially large delivery-radius circles when there are many
  // hubs — can bleed out into the header, footer, or sidebar.
  svg += `<defs><clipPath id="mapClip"><rect x="${mapX}" y="${mapY}" width="${mapW}" height="${mapH}"/></clipPath></defs>`;
  svg += `<g clip-path="url(#mapClip)">`;

  // state boundaries (reprojected from the app's internal 960x600 paths)
  Object.values(STATE_PATHS).forEach(d=>{
    svg += `<path d="${reprojectPathD(d, mp, mapX, mapY)}" fill="${PAL.MAPFILL}" stroke="${PAL.MAPSTROKE}" stroke-width="1"/>`;
  });

  // state labels
  STATE_LABELS.forEach(s=>{
    const [x,y] = toMap(s.lat, s.lon);
    svg += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="11" fill="${PAL.MAPLABEL}" text-anchor="middle" dominant-baseline="middle">${s.abbr}</text>`;
  });

  // assignment lines
  const maxAmt = Math.max(1,...sourcing.flows.map(f=>f.amt));
  sourcing.flows.forEach(f=>{
    const n = S.demand.find(x=>x.id===f.nodeId), s = S.supply.find(x=>x.id===f.sourceId);
    if(!n||!s) return;
    const [x1,y1]=toMap(n.lat,n.lon), [x2,y2]=toMap(s.lat,s.lon);
    const w = 0.7 + 3.2*(f.amt/maxAmt);
    svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#8FA3BF" stroke-width="${w.toFixed(2)}" opacity="0.5"/>`;
  });

  // hub delivery radius circles + markers (respects the same on-screen toggle as the live map)
  const kmPerMile = 1.60934;
  const deliveryRadiusPx = S.params.targetRadius * kmPerMile * mp.scale;
  if(S.showTrailerRadius){
    hubs.forEach(h=>{
      const [x,y] = toMap(h.lat,h.lon);
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${deliveryRadiusPx.toFixed(1)}" fill="#F2A900" fill-opacity="0.06" stroke="#F2A900" stroke-width="1.6" opacity="0.8"/>`;
    });
  }
  hubs.forEach(h=>{
    const [x,y] = toMap(h.lat,h.lon);
    svg += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(45)"><rect x="-8" y="-8" width="16" height="16" fill="#F2A900" stroke="#fff" stroke-width="1.8"/></g>`;
  });

  // Mobile HyCAS response circles + triangle markers
  const hycasRadiusPx = S.params.hycasRadius * kmPerMile * mp.scale;
  if(S.showHycasRadius){
    (hycasUnits||[]).forEach(u=>{
      const [x,y] = toMap(u.lat,u.lon);
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${hycasRadiusPx.toFixed(1)}" fill="#7A5195" fill-opacity="0.05" stroke="#7A5195" stroke-width="1.4" stroke-dasharray="6,4" opacity="0.75"/>`;
    });
  }
  (hycasUnits||[]).forEach(u=>{
    const [x,y] = toMap(u.lat,u.lon);
    svg += `<polygon points="${x.toFixed(1)},${(y-11).toFixed(1)} ${(x+9.5).toFixed(1)},${(y+7).toFixed(1)} ${(x-9.5).toFixed(1)},${(y+7).toFixed(1)}" fill="#7A5195" stroke="#fff" stroke-width="1.8"/>`;
  });

  // supply markers
  S.supply.forEach(s=>{
    const [x,y] = toMap(s.lat,s.lon);
    const isFuture = (s.status||'current')==='future';
    const isActive = !isFuture || S.params.includeFuture;
    const fill = isFuture ? (isActive ? '#5B9BD9' : PAL.MAPFILL) : '#0071CE';
    const dash = isFuture ? ' stroke-dasharray="3,2"' : '';
    const opacity = isActive ? 1 : 0.55;
    svg += `<rect x="${(x-6.5).toFixed(1)}" y="${(y-6.5).toFixed(1)}" width="13" height="13" fill="${fill}" stroke="#0071CE" stroke-width="1.8" opacity="${opacity}"${dash}/>`;
  });

  // demand markers
  const maxRate = Math.max(1,...S.demand.map(n=>n.rate));
  S.demand.forEach(n=>{
    const [x,y] = toMap(n.lat,n.lon);
    const r = 5.5 + 11*Math.sqrt(n.rate/maxRate);
    const tier = risk[n.id].tier;
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${riskColor[tier]}" stroke="#fff" stroke-width="1.6" opacity="0.94"/>`;
  });

  svg += `</g>`; // end mapClip — nothing after this point is part of the clipped map layer

  // ---- sidebar ----
  const sbX = mapX+mapW+24, sbW = VBW-36-sbX;
  svg += `<rect x="${sbX}" y="${mapY}" width="${sbW}" height="${mapH}" fill="${PAL.PANEL}" stroke="${BORDER}" stroke-width="1" rx="6"/>`;

// Builds a standalone 16:9 slide listing tabular detail (used for the Hub and HyCAS detail pages
// that follow the main map in the exported set) — same header/footer aesthetic and theme palette
// as the map page, so the pages read as one consistent deck.
function buildTablePageSVG(exportTheme, title, subtitle, columns, rows){
  const VBW = 1920, VBH = 1080;
  const PALETTES = {
    light: { BG:'#F5F6F8', PANEL:'#FFFFFF', BORDER:'#D9DEE5', MUTED:'#5A6472', TEXT:'#22303F', HEADING:'#0B2545' },
    dark:  { BG:'#0F1620', PANEL:'#171F2B', BORDER:'#2B3644', MUTED:'#98A4B7', TEXT:'#E4E9F0', HEADING:'#EDF1F7' },
  };
  const PAL = PALETTES[exportTheme==='dark' ? 'dark' : 'light'];
  const NAVY=PAL.HEADING, BG=PAL.BG, BORDER=PAL.BORDER, MUTED=PAL.MUTED, TEXT=PAL.TEXT;

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${VBW}" height="${VBH}" viewBox="0 0 ${VBW} ${VBH}" font-family="Arial,Helvetica,sans-serif">`;
  svg += `<rect x="0" y="0" width="${VBW}" height="${VBH}" fill="${BG}"/>`;
  svg += `<text x="36" y="52" font-size="30" font-weight="700" fill="${NAVY}">${esc(title)}</text>`;
  svg += `<text x="36" y="80" font-size="14" fill="${MUTED}">${esc(subtitle)}</text>`;
  svg += `<rect x="36" y="90" width="120" height="4" fill="#0071CE"/>`;
  svg += `<line x1="36" y1="100" x2="${VBW-36}" y2="100" stroke="${BORDER}" stroke-width="1"/>`;

  const panelX=36, panelY=118, panelW=VBW-72, panelH=VBH-118-58;
  svg += `<rect x="${panelX}" y="${panelY}" width="${panelW}" height="${panelH}" fill="${PAL.PANEL}" stroke="${BORDER}" stroke-width="1" rx="6"/>`;

  const padX = 22;
  const colX = []; let acc = panelX+padX;
  columns.forEach(c=>{ colX.push(acc); acc += panelW*c.widthFrac; });

  const headerH = 34;
  svg += `<rect x="${panelX}" y="${panelY}" width="${panelW}" height="${headerH}" fill="${exportTheme==='dark'?'#1E2836':'#F6F8FA'}" rx="6"/>`;
  svg += `<rect x="${panelX}" y="${panelY+headerH-8}" width="${panelW}" height="8" fill="${exportTheme==='dark'?'#1E2836':'#F6F8FA'}"/>`; // square off bottom corners of header band
  columns.forEach((c,i)=>{
    svg += `<text x="${colX[i]}" y="${panelY+headerH/2+4}" font-size="12" font-weight="700" fill="${MUTED}">${esc(c.label.toUpperCase())}</text>`;
  });
  svg += `<line x1="${panelX}" y1="${panelY+headerH}" x2="${panelX+panelW}" y2="${panelY+headerH}" stroke="${BORDER}" stroke-width="1"/>`;

  const availH = panelH - headerH - 16;
  const rowH = Math.max(34, Math.min(56, rows.length? availH/rows.length : availH));
  let ry = panelY + headerH + rowH*0.62;
  rows.forEach((row,ri)=>{
    if(ri%2===1){ svg += `<rect x="${panelX+2}" y="${panelY+headerH+ri*rowH}" width="${panelW-4}" height="${rowH}" fill="${exportTheme==='dark'?'#1A222E':'#FAFBFC'}"/>`; }
    row.forEach((cell,ci)=>{
      if(cell && typeof cell==='object'){
        svg += `<text x="${colX[ci]}" y="${ry-6}" font-size="13" font-weight="700" fill="${TEXT}">${esc(cell.main)}</text>`;
        svg += `<text x="${colX[ci]}" y="${ry+10}" font-size="11" fill="${MUTED}">${esc(cell.sub||'')}</text>`;
      } else {
        svg += `<text x="${colX[ci]}" y="${ry+2}" font-size="13" fill="${TEXT}">${esc(cell===undefined||cell===null?'—':cell)}</text>`;
      }
    });
    ry += rowH;
  });

  svg += `<line x1="36" y1="${VBH-40}" x2="${VBW-36}" y2="${VBH-40}" stroke="${BORDER}" stroke-width="1"/>`;
  svg += `<text x="36" y="${VBH-16}" font-size="11.5" fill="${MUTED}">Generated by HyWeave — ${new Date().toLocaleDateString()}</text>`;
  svg += `<text x="${VBW-36}" y="${VBH-16}" font-size="11.5" fill="${MUTED}" text-anchor="end">${rows.length} row(s)</text>`;
  svg += `</svg>`;
  return svg;
}

function svgToPngDownload(svgStr, filename, bgColor){
  return new Promise((resolve)=>{
    const svgBlob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      canvas.width = 1920; canvas.height = 1080;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bgColor;
      ctx.fillRect(0,0,1920,1080);
      ctx.drawImage(img,0,0,1920,1080);
      URL.revokeObjectURL(url);
      canvas.toBlob(function(blob){
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        resolve(true);
      }, 'image/png');
    };
    img.onerror = function(){ URL.revokeObjectURL(url); resolve(false); };
    img.src = url;
  });
}

// Exports a small deck: page 1 is the map (unchanged), page 2 lists every proposed staging hub's
// full detail, and page 3 (if any HyCAS units exist) lists every HyCAS unit's detail — each a
// separate 16:9 PNG so they drop into a slide deck as consecutive slides.
async function exportPresentationMap(){
  if(!lastComputed){ alert('View Optimization Results first.'); return; }
  const themeSel = document.getElementById('exportThemeSelect');
  const exportTheme = themeSel ? themeSel.value : 'light';
  const bg = exportTheme==='dark' ? '#0F1620' : '#F5F6F8';
  const dateStr = new Date().toISOString().slice(0,10);

  const ok1 = await svgToPngDownload(buildPresentationSVG(exportTheme), `h2_network_map_${exportTheme}_${dateStr}.png`, bg);
  if(!ok1){ alert('Could not render the presentation map image. Your browser may be blocking SVG-to-canvas conversion for this file — try again, or right-click the on-screen map and save it directly as a fallback.'); return; }

  if(lastComputed.hubs && lastComputed.hubs.length>0){
    await new Promise(r=>setTimeout(r,350));
    await svgToPngDownload(buildHubDetailPageSVG(exportTheme), `h2_network_hubs_${exportTheme}_${dateStr}.png`, bg);
  }
  if(lastComputed.hycasUnits && lastComputed.hycasUnits.length>0){
    await new Promise(r=>setTimeout(r,350));
    await svgToPngDownload(buildHycasDetailPageSVG(exportTheme), `h2_network_hycas_${exportTheme}_${dateStr}.png`, bg);
  }
}

/* ===================== AUTOCOMPLETE ===================== */
function wireAutocomplete(inputId, ddId, latId, lonId){
  const input = document.getElementById(inputId);
  const dd = document.getElementById(ddId);
  if(!input) return;
  input.addEventListener('input', ()=>{
    const v = input.value.trim().toLowerCase();
    if(v.length<2){ dd.style.display='none'; return; }
    const matches = CITIES.filter(c=>c[0].toLowerCase().startsWith(v)).slice(0,8);
    if(matches.length===0){ dd.style.display='none'; return; }
    dd.innerHTML = matches.map(c=>`<div data-lat="${c[2]}" data-lon="${c[3]}" data-label="${esc(c[0])}, ${esc(c[1])}">${esc(c[0])}, ${esc(c[1])}</div>`).join('');
    dd.style.display='block';
    dd.querySelectorAll('div').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        input.value = opt.dataset.label;
        document.getElementById(latId).value = opt.dataset.lat;
        document.getElementById(lonId).value = opt.dataset.lon;
        dd.style.display='none';
      });
    });
  });
  document.addEventListener('click', (e)=>{ if(e.target!==input) dd.style.display='none'; });
}

    const days = parseFloat(document.getElementById('fScenarioDays').value);
    const turnaround = parseFloat(document.getElementById('fScenarioTurnaround').value);
    if(sourceIds.length===0 && nodeIds.length===0){ alert(PORTAL_MODE?'Check at least one site to report as down.':'Check at least one supply source or demand node to simulate down.'); return; }
    if(isNaN(days)||days<=0){ alert('Enter a valid outage duration in days.'); return; }
    if(isNaN(turnaround)||turnaround<0){ alert('Enter a valid turnaround time in hours.'); return; }
    S.scenarioSourceIds = sourceIds; S.scenarioNodeIds = nodeIds; S.scenarioDays = days; S.scenarioTurnaround = turnaround;
    lastScenario = computeScenario(sourceIds, nodeIds, days, turnaround);
    render();
  });
  const btnLoadCustomerScenario = document.getElementById('btnLoadCustomerScenario');
  if(btnLoadCustomerScenario) btnLoadCustomerScenario.addEventListener('click', ()=>document.getElementById('customerScenarioFileInput').click());
  const customerScenarioFileInput = document.getElementById('customerScenarioFileInput');
  if(customerScenarioFileInput) customerScenarioFileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    applyScenarioFile(file, (err, data)=>{
      if(err){ alert('Failed to load scenario file: '+err.message); return; }
      lastScenario = null;
      render();
    });
    e.target.value = '';
  });
  const lnkLoadDifferentScenario = document.getElementById('lnkLoadDifferentScenario');
  if(lnkLoadDifferentScenario) lnkLoadDifferentScenario.addEventListener('click', (e)=>{
    e.preventDefault();
    S.demand = []; S.supply = []; lastScenario = null;
    render();
  });
  const fNotifyEmail = document.getElementById('fNotifyEmail');
  if(fNotifyEmail) fNotifyEmail.addEventListener('change', (e)=>{ S.notifyEmail = e.target.value.trim(); render(); });
  const btnNotifyTeam = document.getElementById('btnNotifyTeam');
  if(btnNotifyTeam) btnNotifyTeam.addEventListener('click', async ()=>{
    if(!lastScenario){ alert('Run a scenario first.'); return; }
    if(PORTAL_MODE){
      const statusEl = document.getElementById('notifyStatus');
      btnNotifyTeam.disabled = true;
      if(statusEl){ statusEl.style.color = 'var(--muted)'; statusEl.textContent = 'Sending…'; }
      try{
        await sendOutageNotification(lastScenario);
        if(statusEl){ statusEl.style.color = '#177A4C'; statusEl.textContent = '✓ Sent — our team has been notified.'; }
      } catch(err){
        if(statusEl){ statusEl.style.color = 'var(--red)'; statusEl.innerHTML = `Could not send automatically (${esc(err.message)}). ${esc(NOTIFY_FALLBACK_TEXT)}`; }
      } finally {
        btnNotifyTeam.disabled = false;
      }
    } else {
      if(!S.notifyEmail){ alert('Enter a notification email address first.'); return; }
      const mailtoUrl = buildNotifyMailto(lastScenario, S.notifyEmail);
      window.location.href = mailtoUrl;
    }
  });
  document.querySelectorAll('[data-checkall]').forEach(btn=>btn.addEventListener('click', ()=>{
    document.querySelectorAll(`.${btn.dataset.checkall}-item`).forEach(el=>el.checked=true);
  }));
  document.querySelectorAll('[data-clearall]').forEach(btn=>btn.addEventListener('click', ()=>{
    document.querySelectorAll(`.${btn.dataset.clearall}-item`).forEach(el=>el.checked=false);
  }));

  if(S.activeTab==='results') drawMap();
}

// Reads whatever is currently in the Parameters form fields (if that tab is showing) and
// commits it to S.params. Safe to call even when the params fields aren't in the DOM.
function commitParamsForm(){
  const pCap = document.getElementById('pCap');
  if(!pCap) return; // params tab isn't currently rendered, nothing to commit
  S.params.trailerCap = parseFloat(document.getElementById('pCap').value)||S.params.trailerCap;
  S.params.costPerMile = parseFloat(document.getElementById('pMile').value)||S.params.costPerMile;
  S.params.avgSpeed = parseFloat(document.getElementById('pSpeed').value)||S.params.avgSpeed;
  S.params.safetyDays = parseFloat(document.getElementById('pSafety').value)||S.params.safetyDays;
  S.params.targetRadius = parseFloat(document.getElementById('pTargetRadius').value)||S.params.targetRadius;
  S.params.targetHours = parseFloat(document.getElementById('pTargetHours').value)||S.params.targetHours;
  S.params.hycasRadius = parseFloat(document.getElementById('pHycasRadius').value)||S.params.hycasRadius;
  S.params.hycasHours = parseFloat(document.getElementById('pHycasHours').value)||S.params.hycasHours;
  S.params.hycasCapacity = parseFloat(document.getElementById('pHycasCapacity').value)||S.params.hycasCapacity;
  S.params.unit = document.getElementById('pUnit').value.trim()||'kg';
}

/* ===================== TOP LEVEL ===================== */
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.addEventListener('click', ()=>{
    if(S.activeTab==='params') commitParamsForm(); // don't silently lose edits when navigating away
    S.activeTab=b.dataset.tab;
    render();
  });
});
/* PORTAL_BLOCK_START */
const btnSampleTop = document.getElementById('btnSample');
if(btnSampleTop) btnSampleTop.addEventListener('click', ()=>{ sampleData(); S.activeTab='results'; render(); });
/* PORTAL_BLOCK_END */
const themeSelectTop = document.getElementById('themeSelect');
if(themeSelectTop) themeSelectTop.addEventListener('change', (e)=>{ applyTheme(e.target.value); });
/* PORTAL_BLOCK_START */
const btnResetTop = document.getElementById('btnReset');
if(btnResetTop) btnResetTop.addEventListener('click', ()=>{
  if(confirm('Clear all data and reset parameters?')){
    S = { demand:[], supply:[], params:{trailerCap:400,costPerMile:3.25,avgSpeed:48,safetyDays:3,targetRadius:250,targetHours:4,unit:'kg',includeFuture:true,hycasRadius:400,hycasHours:6,hycasCapacity:1000}, activeTab:'demand', demandForm:null, supplyForm:null, scenarioSourceIds:[], scenarioNodeIds:[], scenarioDays:3, scenarioTurnaround:2, notifyEmail:'', showTrailerRadius:true, showHycasRadius:true, pricing:{} };
    lastScenario = null;
    render();
  }
});

const btnSaveScenarioTop = document.getElementById('btnSaveScenario');
if(btnSaveScenarioTop) btnSaveScenarioTop.addEventListener('click', ()=>{
  const snapshot = {
    format: 'h2-network-optimizer-scenario',
    version: 1,
    savedAt: new Date().toISOString(),
    demand: S.demand,
    supply: S.supply,
    params: S.params,
    results: lastComputed ? {
      kpi: lastComputed.kpi,
      hubs: lastComputed.hubs.map(h=>({
        hub: h.idx, proposedLat: h.lat, proposedLon: h.lon,
        nearestReferenceCity: h.cityRef ? `${h.cityRef.name}, ${h.cityRef.state}` : null,
        nearestReferenceDistMiles: h.cityRef ? h.cityRef.dist : null,
        nearestExistingFacility: h.nearestFacility ? h.nearestFacility.name : null,
        nearestExistingFacilityDistMiles: h.nearestFacilityDist,
        nodesCovered: h.covered.length, coverageDemand: h.coveredDemand,
        avgReachMiles: h.avgDist, maxReachMiles: h.maxDist,
        avgReachHours: h.avgHours, maxReachHours: h.maxHours,
        trailersRecommended: h.trailers,
        stagingFillSource: h.stagingSource ? h.stagingSource.name : null,
        stagingSourceDistMiles: h.stagingSourceDist,
        costPerTrailer: h.costPerTrailer, oneTimeStagingCost: h.stagingCost,
      })),
      hycasUnits: (lastComputed.hycasUnits||[]).map(u=>({
        unit: u.idx, proposedLat: u.lat, proposedLon: u.lon,
        nearestReferenceCity: u.cityRef ? `${u.cityRef.name}, ${u.cityRef.state}` : null,
        nearestReferenceDistMiles: u.cityRef ? u.cityRef.dist : null,
        nearestExistingFacility: u.nearestFacility ? u.nearestFacility.name : null,
        nearestExistingFacilityDistMiles: u.nearestFacilityDist,
        nodesCovered: u.covered.length,
        avgReachMiles: u.avgDist, maxReachMiles: u.maxDist,
        avgReachHours: u.avgHours, maxReachHours: u.maxHours,
        largestCoveredNodeRate: u.maxNodeRate, capacitySufficient: u.capacitySufficient,
      })),
      sourcing: lastComputed.sourcing.flows.map(f=>{
        const n = S.demand.find(x=>x.id===f.nodeId), s = S.supply.find(x=>x.id===f.sourceId);
        return { demandNode: n?n.name:f.nodeId, supplySource: s?s.name:f.sourceId, distanceMiles: f.dist, travelTimeHours: f.dist/S.params.avgSpeed, volume: f.amt, trailerTrips: f.trips, effectiveLandedCost: f.effectiveLanded, totalCost: f.totalCost };
      }),
      risk: S.demand.map(n=>{
        const r = lastComputed.risk[n.id];
        return { demandNode: n.name, consumption: n.rate, servicedVia: r.servicedVia, hubIndex: r.hubIdx, effectiveDistanceMiles: r.tierDist, withinTarget: r.tier!=='High', primarySourceDistanceMiles: r.primaryDist, riskTier: r.tier };
      }),
    } : null
  };
  const blob = new Blob([JSON.stringify(snapshot,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `h2_network_scenario_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
});

const btnLoadScenarioTop = document.getElementById('btnLoadScenario');
// Shared by the internal "Load Scenario" header button and the portal's "Load Your Scenario"
// control — parses a saved-scenario JSON (from btnSaveScenario) and applies its demand/supply/
// params as the new baseline. onDone(err, data) fires with err=null on success.
function applyScenarioFile(file, onDone){
  if(!file){ return; }
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data.demand) || !Array.isArray(data.supply)) throw new Error('File does not look like a saved scenario (missing demand/supply arrays).');
      const defaults = {trailerCap:400,costPerMile:3.25,avgSpeed:48,safetyDays:3,targetRadius:250,targetHours:4,unit:'kg',includeFuture:true,hycasRadius:400,hycasHours:6,hycasCapacity:1000};
      S.demand = data.demand.map(n=>({ id:n.id||uid(), name:n.name, city:n.city||'', lat:parseFloat(n.lat), lon:parseFloat(n.lon), rate:parseFloat(n.rate), safetyDays:parseFloat(n.safetyDays)||defaults.safetyDays }));
      S.supply = data.supply.map(n=>({ id:n.id||uid(), name:n.name, city:n.city||'', lat:parseFloat(n.lat), lon:parseFloat(n.lon), capacity:parseFloat(n.capacity), cost:parseFloat(n.cost), status:(n.status==='future'?'future':'current') }));
      S.params = Object.assign({}, defaults, data.params||{});
      S.demandForm=null; S.supplyForm=null;
      onDone(null, data);
    } catch(err){
      onDone(err, null);
    }
  };
  reader.readAsText(file);
}

if(btnLoadScenarioTop) btnLoadScenarioTop.addEventListener('click', ()=>document.getElementById('scenarioFileInput').click());
const scenarioFileInputTop = document.getElementById('scenarioFileInput');
if(scenarioFileInputTop) scenarioFileInputTop.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  applyScenarioFile(file, (err, data)=>{
    if(err){ alert('Failed to load scenario file: '+err.message); return; }
    S.activeTab='results';
    render();
    alert('Scenario loaded successfully.' + (data.savedAt ? ` (originally saved ${new Date(data.savedAt).toLocaleString()})` : '') + ' Results have been recalculated from the loaded inputs.');
  });
  e.target.value='';
});
const btnExportTop = document.getElementById('btnExport');
if(btnExportTop) btnExportTop.addEventListener('click', ()=>{
  if(!lastComputed){ alert('Load data and view Optimization Results first.'); return; }
  const {sourcing, risk, hubs, hycasUnits} = lastComputed;
  let csv = 'SOURCING PLAN\nDemand Node,Assigned Source,Source Status,Distance (mi),Travel Time,Volume,Trailers/day,Landed Cost,Daily Cost\n';
  S.demand.forEach(n=>{
    sourcing.nodeSummary[n.id].flows.forEach(f=>{
      const src = S.supply.find(s=>s.id===f.sourceId);
      csv += `"${n.name}","${src.name}",${(src.status||'current')==='future'?'Planned':'Current'},${f.dist.toFixed(1)},"${fmtHours(f.dist/S.params.avgSpeed)}",${f.amt.toFixed(1)},${f.trips},${f.effectiveLanded.toFixed(3)},${f.totalCost.toFixed(2)}\n`;
    });
  });
  csv += '\nRESILIENCY PLAN\nHub,Proposed Lat,Proposed Lon,Proposed City,Proposed State,Distance from City Center (mi),Nearest Existing Facility,Nearest Facility Distance (mi),Nodes Covered,Coverage Demand,Avg Reach (mi),Avg Reach Time,Max Reach (mi),Max Reach Time,Trailers,Fill Source,Fill Source Distance (mi),Cost Per Trailer,One-Time Staging Cost\n';
  hubs.forEach(h=>{
    csv += `Hub ${h.idx},${h.lat.toFixed(4)},${h.lon.toFixed(4)},"${h.cityRef?h.cityRef.name:''}","${h.cityRef?h.cityRef.state:''}",${h.cityRef?h.cityRef.dist.toFixed(1):''},"${h.nearestFacility?h.nearestFacility.name:''}",${h.nearestFacility?h.nearestFacilityDist.toFixed(1):''},${h.covered.length},${h.coveredDemand.toFixed(1)},${h.avgDist.toFixed(1)},"${fmtHours(h.avgHours)}",${h.maxDist.toFixed(1)},"${fmtHours(h.maxHours)}",${h.trailers},"${h.stagingSource?h.stagingSource.name:''}",${h.stagingSource?h.stagingSourceDist.toFixed(1):''},${h.costPerTrailer.toFixed(2)},${h.stagingCost.toFixed(2)}\n`;
  });
  csv += '\nMOBILE HyCAS PLACEMENT PLAN\nUnit,Proposed Lat,Proposed Lon,Proposed City,Proposed State,Distance from City Center (mi),Nearest Existing Facility,Nearest Facility Distance (mi),Nodes Covered,Avg Reach (mi),Avg Reach Time,Max Reach (mi),Max Reach Time,Largest Covered Node Rate,Capacity Sufficient\n';
  (hycasUnits||[]).forEach(u=>{
    csv += `Unit ${u.idx},${u.lat.toFixed(4)},${u.lon.toFixed(4)},"${u.cityRef?u.cityRef.name:''}","${u.cityRef?u.cityRef.state:''}",${u.cityRef?u.cityRef.dist.toFixed(1):''},"${u.nearestFacility?u.nearestFacility.name:''}",${u.nearestFacility?u.nearestFacilityDist.toFixed(1):''},${u.covered.length},${u.avgDist.toFixed(1)},"${fmtHours(u.avgHours)}",${u.maxDist.toFixed(1)},"${fmtHours(u.maxHours)}",${u.maxNodeRate.toFixed(1)},${u.capacitySufficient?'Yes':'No'}\n`;
  });
  csv += '\nRISK ASSESSMENT\nDemand Node,Consumption,Serviced Via,Effective Distance (mi),Within Target,Primary Source,Source Distance,Risk Tier\n';
  S.demand.forEach(n=>{
    const r = risk[n.id];
    const primary = sourcing.nodeSummary[n.id].primary;
    const srcName = primary? S.supply.find(s=>s.id===primary.sourceId).name : '';
    const viaLabel = r.servicedVia==='source' ? `Direct: ${srcName}` : (r.servicedVia==='hub' ? `Hub ${r.hubIdx}` : '');
    csv += `"${n.name}",${n.rate},"${viaLabel}",${r.tierDist!==undefined && r.tierDist!==null?r.tierDist.toFixed(1):''},${r.tier!=='High'?'Yes':'No'},"${srcName}",${r.primaryDist.toFixed(1)},${r.tier}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'h2_network_optimization.csv'; a.click();
});
/* PORTAL_BLOCK_END */

render();

</script>
